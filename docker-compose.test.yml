services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contractai_test
      POSTGRES_USER: contractai_test
      POSTGRES_PASSWORD: contractai_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractai_test -d contractai_test"]
      interval: 5s
      timeout: 5s
      retries: 10
