[project]
name = "pactus-backend"
version = "0.10.0"
description = "Backend para Pactus - Gestión de Contratos"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.135.1",
    "langchain>=1.2.13",
    "langgraph>=1.1.3",
    "loguru>=0.7.3",
    "pydantic>=2.7.4",
    "sqlalchemy>=2.0.38",
    "uvicorn>=0.42.0",
    "azure-keyvault-secrets>=4.10.0",
    "azure-identity>=1.25.3",
    "pydantic-settings>=2.13.1",
    "langchain-google-genai>=4.2.1",
    "sqlmodel>=0.0.37",
    "asyncpg>=0.31.0",
    "llama-cloud>=1.0",
    "qdrant-client>=1.17.1",
    "llama-index-vector-stores-qdrant>=0.10.0",
    "llama-index-embeddings-openai>=0.6.0",
    "python-multipart>=0.0.22",
    "psycopg-pool>=3.3.0",
    "langgraph-checkpoint-postgres>=3.0.5",
    "psycopg-binary>=3.3.3",
    "langchain-community>=0.1.0",
    "google-api-python-client>=2.193.0",
    "google-auth-oauthlib>=1.3.0",
    "markdown2",
    "weasyprint",
]

[project.scripts]
start = "pactus_backend.main:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.ty.src]
exclude = ["**/tests/**"]

[tool.ruff]
line-length = 150
exclude = ["**/tests/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "D", "PL", "B", "W", "ARG", "RUF", "UP", "PTH"]
ignore = [
    "B008",   # FastAPI intentionally uses Query/Depends factories in signatures.
    "D100",   # Module docstrings are not consistently useful in this modular backend.
    "D101",
    "D102",   # Public methods often implement protocol/framework hooks with obvious names.
    "D103",   # Route handlers are documented at OpenAPI level where useful.
    "D104",
    "D107",
    "D417",
    "E501",   # Legal/LLM prompts and SQL expressions are safer when kept intact.
    "PLR0911", # Domain branching is clearer than premature indirection in validators/formatters.
    "PLR0912",
    "PLR0913", # FastAPI dependency providers and service constructors naturally exceed 5 args.
    "PLR2004", # Domain thresholds are readable inline when they are local to one rule.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 5

[tool.semantic_release]
version_variables = ["pyproject.toml:version"]
build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""
upload_to_vcs_release = true
upload_to_pypi = false
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
template_dir = "templates"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "build", "chore", "ci", "docs", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "Sam Altman <not-for-profit@openai.com>"

[dependency-groups]
dev = [
    "python-semantic-release>=10.5.3",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff",
    "ty",
    "locust>=2.44.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=xml --cov-report=html --cov-report=term"

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/pactus_backend/main.py",
    "src/pactus_backend/factory.py",
    "src/pactus_backend/shared/logger.py",
]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "\\.\\.\\.",
]
show_missing = true
fail_under = 64
