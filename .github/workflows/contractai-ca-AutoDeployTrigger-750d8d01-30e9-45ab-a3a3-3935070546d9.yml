name: Trigger auto deployment for contractai-ca

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/contractai-ca-AutoDeployTrigger-750d8d01-30e9-45ab-a3a3-3935070546d9.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CONTRACTAICA_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CONTRACTAICA_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CONTRACTAICA_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: supportbackendia.azurecr.io
          registryUsername: ${{ secrets.CONTRACTAICA_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CONTRACTAICA_REGISTRY_PASSWORD }}
          containerAppName: contractai-ca
          resourceGroup: contractai
          imageToBuild: supportbackendia.azurecr.io/contractai-ca:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


